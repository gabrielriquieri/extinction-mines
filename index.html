<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena de Ares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app">

        <!-- TELA DE CADASTRO / LOGIN -->
        <section id="telaCadastro" class="card">
            <h2>⚔️ Registro de Guerreiro</h2>
            <form id="formCadastro">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@gmail.com" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
                </div>
                <p id="erroCadastro" class="erro"></p>
                <button type="submit" class="btn-acao">Entrar na Arena</button>
            </form>
            <button id="btnGoogle" class="btn-secundario">Preencher com Google</button>
        </section>

        <!-- TELA DO JOGO -->
        <section id="jogo" class="card escondido">
            <header class="header-jogo">
                <span id="jogador">⚔️ Guerreiro</span>
                <button id="btnTrocarJogador" class="btn-pequeno">Trocar</button>
            </header>

            <div class="painel-status">
                <div class="status-item">
                    <span>Pontos</span>
                    <strong id="saldo">100</strong>
                </div>
                <div class="status-item">
                    <span>Multiplicador</span>
                    <strong id="multiplicador">1.0x</strong>
                </div>
                <div class="status-item">
                    <span>Prêmio Atual</span>
                    <strong id="lucroAtual">0</strong>
                </div>
            </div>

            <div class="configuracoes">
                <div class="campo">
                    <label for="valorAposta">Aposta:</label>
                    <input type="number" id="valorAposta" value="10" min="1">
                </div>
                <div class="campo">
                    <label for="qtdMinas">Minas:</label>
                    <input type="number" id="qtdMinas" value="5" min="1" max="30">
                </div>
                <div class="campo">
                    <label for="tamanhoTabuleiro">Tamanho:</label>
                    <select id="tamanhoTabuleiro">
                        <option value="4">4x4</option>
                        <option value="5">5x5</option>
                        <option value="6" selected>6x6</option>
                    </select>
                </div>
            </div>

            <div id="grade" class="grade"></div>

            <button id="btnAcao" class="btn-acao" disabled>⚔️ COMEÇAR RODADA</button>
            <p id="mensagem" class="mensagem"></p>
        </section>

    </main>

    <!-- OVERLAY DE STATUS ESTILO YOU DIED (2 SEGUNDOS) -->
    <div id="overlayStatus" class="overlay-status escondido">
        <div id="textoStatus" class="texto-status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
