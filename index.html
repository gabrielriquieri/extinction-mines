<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arena de Ares</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TELA DE CADASTRO
    ========================== -->

    <div id="telaCadastro" class="tela-cadastro">

        <div class="card-cadastro">

            <div class="icone-cadastro">⚔️</div>

            <h1>ARENA DE ARES</h1>

            <h2>Cadastro do Guerreiro</h2>

            <p>
                Antes de entrar na arena,
                informe seu nome.
            </p>

            <form id="formCadastro">

                <div class="campo">

                    <label for="nomeJogador">
                        Nome ou apelido
                    </label>

                    <input
                        type="text"
                        id="nomeJogador"
                        placeholder="Digite seu nome"
                        maxlength="25"
                        autocomplete="off"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-entrar"
                >
                    ⚔️ ENTRAR NA ARENA
                </button>

            </form>

            <p
                id="erroCadastro"
                class="erro-cadastro"
            ></p>

        </div>

    </div>


    <!-- =========================
         FUNDO
    ========================== -->

    <div id="fagulhas-container"></div>


    <!-- =========================
         JOGO
    ========================== -->

    <main class="container">

        <header class="topo">

            <div>

                <h1>⚔️ ARENA DE ARES</h1>

                <p id="jogador">
                    Guerreiro
                </p>

            </div>

            <button
                id="btnTrocarJogador"
                class="btn-secundario"
            >
                Trocar jogador
            </button>

        </header>


        <!-- PAINEL -->

        <section class="painel">

            <div class="status-bar">

                <div class="status">

                    <span>🏆 Pontos</span>

                    <strong id="saldo">
                        100
                    </strong>

                </div>

                <div class="status">

                    <span>⚡ Multiplicador</span>

                    <strong id="multiplicador">
                        x1.0
                    </strong>

                </div>

                <div class="status">

                    <span>💎 Pontos da rodada</span>

                    <strong id="lucroAtual">
                        0
                    </strong>

                </div>

            </div>

            <div class="divisor"></div>


            <!-- CONTROLES -->

            <div class="controles">

                <div class="campo-grupo">

                    <label for="qtdMinas">
                        ☠️ Minas
                    </label>

                    <select id="qtdMinas">

                        <option value="3">
                            3
                        </option>

                        <option value="5" selected>
                            5
                        </option>

                        <option value="7">
                            7
                        </option>

                        <option value="9">
                            9
                        </option>

                    </select>

                </div>


                <div class="campo-grupo">

                    <label for="tamanhoTabuleiro">
                        🏛️ Tabuleiro
                    </label>

                    <select id="tamanhoTabuleiro">

                        <option value="5" selected>
                            5 x 5
                        </option>

                        <option value="6">
                            6 x 6
                        </option>

                        <option value="7">
                            7 x 7
                        </option>

                    </select>

                </div>

            </div>


            <!-- BOTÃO -->

            <button
                id="btnAcao"
                class="btn-acao btn-apostar"
            >
                ⚔️ COMEÇAR RODADA
            </button>


            <p id="mensagem">
                Encontre as relíquias e evite as minas!
            </p>

        </section>


        <!-- TABULEIRO -->

        <section id="grade-container">

            <div id="grade"></div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
