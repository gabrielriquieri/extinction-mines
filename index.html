/* =========================

.tela-cadastro {
    position: fixed;
    inset: 0;

.card-cadastro {
    width: 100%;

E substitua a parte do JavaScript responsável pelo cadastro por:

```javascript
/* =========================
   CADASTRO
========================= */

const telaCadastro =
    document.getElementById("telaCadastro");

const formCadastro =
    document.getElementById("formCadastro");

const nomeJogador =
    document.getElementById("nomeJogador");

const erroCadastro =
    document.getElementById("erroCadastro");

const jogador =
    document.getElementById("jogador");


/* Verifica se já existe um cadastro */

function verificarCadastro() {

    const nomeSalvo =
        localStorage.getItem("nomeJogador");

    if (nomeSalvo) {

        jogador.textContent =
            `⚔️ Guerreiro: ${nomeSalvo}`;

        telaCadastro.classList.add(
            "escondido"
        );

    } else {

        telaCadastro.classList.remove(
            "escondido"
        );

    }

}


/* Quando clicar em ENTRAR */

formCadastro.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const nome =
            nomeJogador.value.trim();


        if (nome.length < 2) {

            erroCadastro.textContent =
                "Digite pelo menos 2 caracteres.";

            return;

        }


        if (nome.length > 25) {

            erroCadastro.textContent =
                "O nome pode ter no máximo 25 caracteres.";

            return;

        }


        /* Salva o nome no navegador */

        localStorage.setItem(
            "nomeJogador",
            nome
        );


        /* Mostra o jogador no jogo */

        jogador.textContent =
            `⚔️ Guerreiro: ${nome}`;


        erroCadastro.textContent = "";


        /* Fecha a tela de cadastro */

        telaCadastro.classList.add(
            "escondido"
        );

    }
);
```

E mantenha no HTML do jogo esta parte:

```html
<p id="jogador"></p>
```

Por fim, no final do JavaScript, deixe:

```javascript
verificarCadastro();
carregarSaldo();
alterarTamanhoTabuleiro();
gerarFagulhasFundo();
```

### Como vai funcionar

**Primeira vez:**

`Site → Tela de cadastro → Digita nome → Entrar no jogo → Tabuleiro`

**Depois:**

`Site → Nome já salvo → Jogo`

Se quiser testar novamente a tela de cadastro, abra o console do navegador e execute:

```javascript
localStorage.removeItem("nomeJogador");
```

Depois atualize a página.
